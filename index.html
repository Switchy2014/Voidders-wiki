<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidder's wiki</title>
    <link rel="stylesheet" href="voider_style.css">
</head>
<body>

    <!-- BOTÓN DARK / LIGHT -->
    <button id="themeToggle">🌙</button>

    <!-- HEADER -->
    <header>
        <h1>Voider Games</h1>
        <p>Welcome to the world of Voider's games! 😎</p>
    </header>

    <!-- INTRO -->
    <section id="introSection">
        <p id="introText">Entering Voider's games gallery...</p>
        <button id="startBtn">Enter</button>
    </section>

    <!-- GALERÍA DE JUEGOS -->
    <section id="gamesSection" style="display: none;">
        <h2 style="text-align: center;">Games</h2>

        <!-- FILTROS -->
        <div class="filters" style="text-align: center; margin-bottom: 20px;">
            <button class="filter-btn" data-filter="all">All</button>
            <button class="filter-btn" data-filter="arcade">Arcade</button>
            <button class="filter-btn" data-filter="puzzle">Puzzle</button>
            <button class="filter-btn" data-filter="horror">Horror</button>
        </div>

        <!-- GALERÍA -->
        <div class="gallery" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">

            <!-- Fun Clicker -->
            <div class="game-card horror"
                 data-name="Fun Clicker"
                 data-desc="An pretty 'normal' clikcer game"
                 data-sound="sounds/funclicker.mp3">
                <a href="Fun_Clicker.html" target="_blank">
                    <img src="FunClicker.png" alt="Fun Clicker" style="width: 200px;">
                </a>
            </div>

            
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>Made by Switchy2014</p>
    </footer>

    <!-- JS -->
    <script src="voider.js"></script>
    <script src="script_main.js"></script>
</body>
</html>
